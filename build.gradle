plugins {
    id "fabric-loom" version "1.16.3"
}

version = "${mod_version}+${minecraft_version}"
group = "dev.pathweaver"

base {
    archivesName = archives_base_name
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.architectury.dev/" }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    // MC 26.x ships already-deobfuscated (named) jars; Loom runs with disableObfuscation=true,
    // so plain implementation/api (no mod* remap configs), and NO mappings declaration.
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly("com.terraformersmc:modmenu:${mod_menu_version}") { transitive false }
    testRuntimeOnly("com.terraformersmc:modmenu:${mod_menu_version}") { transitive false }

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    // Compile-time too, not just runtime: MinecraftBootstrapListener implements
    // LauncherSessionListener so Minecraft's registries boot before the first test class is loaded.
    testImplementation "org.junit.platform:junit-platform-launcher:1.10.2"
    // Exact audited artifacts used by compatibility fingerprint/ASM-shape tests.
    testRuntimeOnly "maven.modrinth:servercore:1.5.19+26.1.2"
    testRuntimeOnly "maven.modrinth:rabbit-pathfinding-fix:1.3.0"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "pathweaver_gametest"
        enableGameTests = true
        eula = true
    }
}

dependencies {
    gametestRuntimeOnly "maven.modrinth:servercore:1.5.19+26.1.2"
    gametestRuntimeOnly "maven.modrinth:rabbit-pathfinding-fix:1.3.0"
}

// The audited-tier mods decide whether PathWeaver does anything on a real modpack, so their
// exemptions are proven against the actual artifacts rather than stand-ins. Only pulled in for the
// dedicated audited harness; the stock aggregate witness must stay free of them.
if (providers.gradleProperty("auditedTierHarness").isPresent()) {
    // Diagonal Blocks ships only as a jar nested inside Diagonal Fences, and Fabric Loader does
    // not unpack jar-in-jar from a classpath entry in this launch mode, so the nested library is
    // extracted and put on the game-test classpath directly -- the same way Lithium is supplied.
    //
    // The parent is fetched from the release CDN rather than through maven.modrinth. That endpoint
    // serves a DIFFERENT artifact for this mod: 128015 bytes with no META-INF/jars at all, versus
    // the 126183-byte release file that actually contains the library. Pin the release hash and
    // fail on mismatch, because a silently substituted parent would stage a library the audit never
    // examined.
    ext.diagonalFencesUrl = "https://cdn.modrinth.com/data/IKARgflD/versions/UUuyVvvj/" +
        "DiagonalFences-v26.1.0-mc26.1.x-Fabric.jar"
    ext.diagonalFencesSha1 = "8327833779f9ad90421fedf50cdd48003b038af2"
    // diagonalblocks declares hard dependencies of its own; loader refuses to start without them.
    // They are staging scaffolding only -- nothing about them is audited or exempted.
    ext.diagonalBlocksDepSources = [
        "puzzleslib.jar": [
            "https://cdn.modrinth.com/data/QAGBst4M/versions/A85OttK1/" +
                "PuzzlesLib-v26.1.12-mc26.1.x-Fabric.jar",
            "d50ebfa970866ec1ae28da4da40407de68b6d92f"],
        "forgeconfigapiport.jar": [
            "https://cdn.modrinth.com/data/ohNO6lps/versions/jUe0ucoE/" +
                "ForgeConfigAPIPort-v26.1.5-mc26.1.x-Fabric.jar",
            "82e4deaa210b75d3b51a268769ad24cc85796235"]]
    ext.diagonalBlocksDeps = diagonalBlocksDepSources.collectEntries { name, spec ->
        [(name): layout.buildDirectory.file("auditedHarness/${name}").get().asFile]
    }
    ext.extractedDiagonalBlocks =
        layout.buildDirectory.file("auditedHarness/diagonalblocks.jar").get().asFile
    tasks.register("extractDiagonalBlocks") {
        outputs.file(extractedDiagonalBlocks)
        outputs.files(diagonalBlocksDeps.values())
        doLast {
            def parent = layout.buildDirectory
                .file("auditedHarness/diagonal-fences-parent.jar").get().asFile
            parent.parentFile.mkdirs()
            if (!parent.exists()) {
                parent.withOutputStream { out ->
                    new java.net.URI(diagonalFencesUrl).toURL().withInputStream {
                        it.transferTo(out)
                    }
                }
            }
            def actual = java.security.MessageDigest.getInstance("SHA-1")
                .digest(parent.bytes).encodeHex().toString()
            if (actual != diagonalFencesSha1) {
                throw new GradleException(
                    "Diagonal Fences parent hash mismatch: expected ${diagonalFencesSha1}, got ${actual}")
            }
            diagonalBlocksDepSources.each { name, spec ->
                def target = diagonalBlocksDeps[name]
                if (!target.exists()) {
                    target.withOutputStream { out ->
                        new java.net.URI(spec[0]).toURL().withInputStream { it.transferTo(out) }
                    }
                }
                def depHash = java.security.MessageDigest.getInstance("SHA-1")
                    .digest(target.bytes).encodeHex().toString()
                if (depHash != spec[1]) {
                    throw new GradleException(
                        "${name} hash mismatch: expected ${spec[1]}, got ${depHash}")
                }
            }
            def zip = new java.util.zip.ZipFile(parent)
            try {
                def entry = zip.entries().toList().find {
                    it.name.startsWith("META-INF/jars/diagonalblocks-fabric-")
                }
                if (entry == null) throw new GradleException("nested diagonalblocks jar not found")
                extractedDiagonalBlocks.parentFile.mkdirs()
                extractedDiagonalBlocks.withOutputStream { out ->
                    zip.getInputStream(entry).withStream { it.transferTo(out) }
                }
            } finally {
                zip.close()
            }
        }
    }
    dependencies {
        gametestRuntimeOnly "maven.modrinth:lithium:${lithium_version}"
        gametestRuntimeOnly files(extractedDiagonalBlocks) { builtBy "extractDiagonalBlocks" }
        gametestRuntimeOnly files(diagonalBlocksDeps.values()) { builtBy "extractDiagonalBlocks" }
    }
    tasks.register("prepareAuditedTierGameTestHarness") {
        dependsOn tasks.named("processGametestResources")
        outputs.upToDateWhen { false }
        doLast {
            copy {
                from file("src/gametest/auditedResources/fabric.mod.json")
                into layout.buildDirectory.dir("resources/gametest")
            }
            // Same reason as the aggregate harness: our own test mixins target PathNavigation, so
            // leaving them registered would deny the very families this witness measures.
            delete layout.buildDirectory.file(
                "resources/gametest/pathweaver-gametest.mixins.json")
        }
    }
    tasks.named("runGameTest") {
        dependsOn tasks.named("prepareAuditedTierGameTestHarness")
    }
}

// Pin the tier on disk for EVERY harness, not just the audited one.
//
// The tier is read during the startup scan, long before a game test can set it, so it has to be in
// the run directory before the server process starts. This used to be written only by the audited
// harness, which left the run directory carrying that file into subsequent runs -- nothing deletes
// it -- so which tier a default run got depended on whether that machine had ever run the audited
// harness. It was invisible while every harness wanted the same tier anyway.
//
// AUDITED for all of them, deliberately decoupled from the shipped default. These harnesses exist to
// witness the gate: PathNavigationRoutingGameTest asserts that stock Fabric API fails closed for
// every family, which is a statement about AUDITED and is unprovable at a tier that denies nothing.
// Letting it inherit the shipped default did not make it go quiet, it made it fail, which is the
// only reason this is a comment rather than a bug report.
//
// The one exception is `-PunsafeTierHarness`, which pins UNSAFE because it witnesses the shipped
// default itself -- the configuration every new user starts in, and until it was added the only one
// with no end-to-end coverage. Note FabricAggregateWalkRoutingGameTest does NOT cover that: it flips
// to UNSAFE in-process to prove the opposite, that a tier written AFTER the scan is inert because
// the tier is frozen until restart. By construction it cannot witness a scan-time UNSAFE.
//
// Written from one unconditional place, because `doFirst` prepends: actions run in reverse
// registration order, so an action registered inside the conditional block above would run AFTER
// this one and overwrite it.
tasks.named("runGameTest") {
    doFirst {
        // Yield to the migration matrix. StartupConfigMigrationProbe arms only when this property
        // is set, and it works by staging a real legacy config on disk and asserting what the
        // serializer made of it. Writing over that fixture would silently convert those runs into a
        // test of this line instead. Previously the clobber only happened under -PauditedTierHarness
        // and so was easy to miss; making the write unconditional made it everyone's problem.
        if (System.getProperty("pathweaver.test.expectedStartupEnabled") != null) {
            logger.lifecycle("game-test config left alone: a startup migration fixture is staged")
            return
        }

        // Read the version out of the source rather than hardcoding it. A stale literal here does
        // not fail as "wrong version": the serializer rejects the config, falls back to
        // enabled=false, and every game test fails at once with a symptom that points nowhere near
        // this line.
        def configSource = file("src/main/java/dev/pathweaver/config/PathWeaverConfig.java").text
        def matcher = configSource =~ /CURRENT_CONFIG_VERSION\s*=\s*(\d+)/
        if (!matcher.find()) {
            throw new GradleException("could not read CURRENT_CONFIG_VERSION from PathWeaverConfig.java; "
                + "the game-test harness cannot write a config the serializer will accept")
        }
        def configVersion = matcher.group(1)
        def tier = providers.gradleProperty("unsafeTierHarness").isPresent() ? "UNSAFE" : "AUDITED"
        def config = layout.buildDirectory
            .file("run/gameTest/config/pathweaver.json").get().asFile
        config.parentFile.mkdirs()
        config.text = "{\"configVersion\":${configVersion},\"enabled\":true,\"compatibilityTier\":\"${tier}\"}"
        logger.lifecycle("game-test harness pinned to compatibilityTier=${tier}, configVersion="
            + "${configVersion}"
            + (tier == "AUDITED" ? " (gate witnesses; the shipped default is UNSAFE)"
                                 : " (witnessing the shipped default)"))
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Keep loader metadata out of the sources jar.
//
// withSourcesJar() sweeps in src/main/resources, so the sources artifact shipped a fabric.mod.json
// -- with "${version}" unexpanded, because processResources only filters the main resources -- plus
// pathweaver.mixins.json and the assets, and no classes at all. Fabric Loader will happily try to
// load that: dropped into mods/ alongside the real jar it is a duplicate `pathweaver` mod id and a
// hard crash, and on its own it is an unparseable version string plus a mixin config whose
// require=1 injectors have nothing to apply to. Either way the crash report names PathWeaver.
//
// Listing both files on a Modrinth version page and having a user grab the wrong one is a routine
// mistake, so the artifact should not be loadable in the first place.
tasks.named("sourcesJar") {
    exclude "fabric.mod.json"
    exclude "pathweaver.mixins.json"
}

test {
    useJUnitPlatform()

    // Fail the build on a skipped test.
    //
    // CertifiedLandProvidersTest booted Minecraft's registries in its own @BeforeAll behind an
    // Assumptions.assumeTrue, so that a JVM without them would skip rather than go red. Run alone it
    // passed 7/7; run in the suite it skipped 7/7, because an earlier class had already poisoned
    // Blocks' static initialiser -- and the suite reported success either way, for as long as anyone
    // had been quoting the test count. A skip that nobody reads is indistinguishable from coverage.
    //
    // If a genuine skip is ever needed, this has to be relaxed deliberately, which is the point.
    def skipped = []
    afterTest { desc, result ->
        if (result.resultType.toString() == 'SKIPPED') {
            skipped << "${desc.className}.${desc.name}"
        }
    }
    doLast {
        if (!skipped.isEmpty()) {
            throw new GradleException("${skipped.size()} test(s) were skipped, which this build "
                + "treats as a failure because a silent skip already cost this project seven "
                + "tests: " + skipped.join(", "))
        }
    }
}

// The harness blocks below overwrite the generated game-test manifest in place. Gradle would
// otherwise consider that output up to date on the next build, so a plain `./gradlew build` run
// after any harness run would keep the harness manifest, demand mods the default run does not
// supply, and fail. Regenerating these resources every time keeps the default build honest.
tasks.named("processGametestResources") {
    outputs.upToDateWhen { false }
}

// The M1 Rabbit worker probe is itself a sensitive PathNavigation mixin. The aggregate-Fabric
// stock-gate witness therefore runs in a second, explicit harness with no test mixins; otherwise
// the observer changes the production scanner decision it is meant to measure.
// The flying/amphibious witness runs alone.
//
// It was briefly registered in the default harness and made that gate flaky: game tests share one
// server, one PathWeaverConfig and one SafetyGate denial set, and a fourth test mutating those
// concurrently with the 1400-tick routing test broke it in two different places on clean builds.
// Two clean builds passed without it and two failed with it, so this is not cold-start noise.
//
// Like the aggregate harness, this one declares no mixin config, so the scan denies nothing and the
// test needs no denial mutation at all -- the coupling is removed rather than merely scheduled
// around.
if (providers.gradleProperty("newFamilyHarness").isPresent()) {
    tasks.register("prepareNewFamilyGameTestHarness") {
        dependsOn tasks.named("processGametestResources")
        outputs.upToDateWhen { false }
        doLast {
            copy {
                from file("src/gametest/newFamilyResources/fabric.mod.json")
                into layout.buildDirectory.dir("resources/gametest")
            }
            delete layout.buildDirectory.file(
                "resources/gametest/pathweaver-gametest.mixins.json")
        }
    }
    tasks.named("runGameTest") {
        dependsOn tasks.named("prepareNewFamilyGameTestHarness")
    }
}

// Witness for the shipped default. Unlike every other harness it KEEPS the sensitive test mixin
// config, because the denial is the point: the waiver is only observable when the scan genuinely
// refused something first. Removing that mixin here would leave a test that passes on an install
// where nothing was ever denied.
if (providers.gradleProperty("unsafeTierHarness").isPresent()) {
    tasks.register("prepareUnsafeTierGameTestHarness") {
        dependsOn tasks.named("processGametestResources")
        outputs.upToDateWhen { false }
        doLast {
            copy {
                from file("src/gametest/unsafeResources/fabric.mod.json")
                into layout.buildDirectory.dir("resources/gametest")
            }
        }
    }
    tasks.named("runGameTest") {
        dependsOn tasks.named("prepareUnsafeTierGameTestHarness")
    }
}

if (providers.gradleProperty("fabricAggregateHarness").isPresent()) {
    tasks.register("prepareFabricAggregateGameTestHarness") {
        dependsOn tasks.named("processGametestResources")
        outputs.upToDateWhen { false }
        doLast {
            copy {
                from file("src/gametest/aggregateResources/fabric.mod.json")
                into layout.buildDirectory.dir("resources/gametest")
            }
            delete layout.buildDirectory.file(
                "resources/gametest/pathweaver-gametest.mixins.json")
        }
    }
    tasks.named("runGameTest") {
        dependsOn tasks.named("prepareFabricAggregateGameTestHarness")
    }
}
