// A measurement-only client mod. It is not PathWeaver and never ships: it is dropped into every arm
// of a client benchmark, identically, so frame times and integrated-server tick times can be read
// the same way whether PathWeaver is present, absent, or a different version.
plugins { id "fabric-loom" version "1.16.3" }
version = "1.0.0"
group = "dev.pathweaver.frameprobe"
base { archivesName = "pw-frameprobe" }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.153.0+26.1.2"
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
